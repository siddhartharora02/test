<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- AstraFit panther mascot v3: soft geometric flat style (no outlines, no gradients),
       3 fur tones + light face band / belly, big round eyes. Render with render_mascot.py. -->
  <defs>
    <path id="head" d="M512 214 C604 214 664 244 694 296 L762 404 C772 422 764 438 748 444 C698 474 618 500 512 500 C406 500 326 474 276 444 C260 438 252 422 262 404 L330 296 C360 244 420 214 512 214 Z"/>
    <clipPath id="headClip"><use href="#head"/></clipPath>
    <path id="earL" d="M292 330 C276 262 290 200 326 186 C364 172 428 210 456 236 Z"/>
    <path id="earInnerL" d="M318 296 C308 252 318 220 338 214 C362 208 402 232 422 248 Z"/>
  </defs>

  <!-- tail (behind, left) -->
  <path d="M440 806 C296 842 222 772 234 668 C242 604 284 586 266 530" fill="none" stroke="#2C2959" stroke-width="54" stroke-linecap="round"/>

  <!-- legs + feet -->
  <rect x="430" y="760" width="74" height="120" rx="20" fill="#3B3870"/>
  <rect x="520" y="760" width="74" height="120" rx="20" fill="#3B3870"/>
  <rect x="418" y="846" width="94" height="50" rx="25" fill="#3B3870"/>
  <rect x="512" y="846" width="94" height="50" rx="25" fill="#3B3870"/>

  <!-- body + belly -->
  <path d="M512 456 C622 456 664 552 656 656 C648 762 604 820 512 820 C420 820 376 762 368 656 C360 552 402 456 512 456 Z" fill="#4B4787"/>
  <ellipse cx="512" cy="712" rx="78" ry="70" fill="#8580CC"/>
  <g fill="#3F3B78"><circle cx="410" cy="612" r="10"/><circle cx="426" cy="630" r="7"/><circle cx="612" cy="780" r="9"/><circle cx="598" cy="764" r="6"/></g>

  <!-- arm down (left) -->
  <path d="M398 540 C378 600 350 652 330 690 C318 714 342 734 362 716 C388 690 414 644 436 598 Z" fill="#3B3870"/>
  <circle cx="326" cy="704" r="20" fill="#3B3870"/><circle cx="344" cy="722" r="20" fill="#3B3870"/><circle cx="366" cy="716" r="18" fill="#3B3870"/>

  <!-- ears -->
  <use href="#earL" fill="#4B4787"/>
  <use href="#earInnerL" fill="#B9A6FF"/>
  <g transform="matrix(-1 0 0 1 1024 0)">
    <use href="#earL" fill="#4B4787"/>
    <use href="#earInnerL" fill="#B9A6FF"/>
  </g>

  <!-- head -->
  <use href="#head" fill="#4B4787"/>
  <g clip-path="url(#headClip)">
    <!-- violet sweatband -->
    <path d="M300 300 C410 262 614 262 724 300 L736 338 C614 300 410 300 288 338 Z" fill="#7B5CFF"/>
    <!-- tiny gold star on the band -->
    <path d="M512 262 L519.6 281 L540 282.4 L524.4 295.4 L529.3 315.2 L512 304.4 L494.7 315.2 L499.6 295.4 L484 282.4 L504.4 281 Z" fill="#FFC93C"/>
  </g>
  <!-- faint rosettes -->
  <g fill="#3F3B78"><circle cx="372" cy="356" r="9"/><circle cx="356" cy="372" r="6"/><circle cx="652" cy="356" r="9"/><circle cx="668" cy="372" r="6"/></g>
  <!-- light face band with a wavy bottom edge, flaring to cheek points -->
  <path d="M262 404 C330 392 404 414 512 414 C620 414 694 392 762 404 C774 422 766 438 750 446 L766 470 C724 482 694 480 664 500 C624 528 574 518 512 540 C450 518 400 528 360 500 C330 480 300 482 258 470 L274 446 C258 438 250 422 262 404 Z" fill="#8580CC"/>

  <!-- eyes: cream sclera, gold iris, dark pupil, two highlights -->
  <circle cx="420" cy="396" r="62" fill="#FFFBF2"/>
  <circle cx="604" cy="396" r="62" fill="#FFFBF2"/>
  <ellipse cx="428" cy="402" rx="40" ry="48" fill="#FFC23C"/>
  <ellipse cx="612" cy="402" rx="40" ry="48" fill="#FFC23C"/>
  <ellipse cx="430" cy="406" rx="24" ry="32" fill="#2B1E3A"/>
  <ellipse cx="614" cy="406" rx="24" ry="32" fill="#2B1E3A"/>
  <circle cx="412" cy="382" r="13" fill="#FFFFFF"/><circle cx="596" cy="382" r="13" fill="#FFFFFF"/>
  <circle cx="442" cy="428" r="6" fill="#FFFFFF"/><circle cx="626" cy="428" r="6" fill="#FFFFFF"/>

  <!-- nose + open smile -->
  <path d="M488 430 Q512 420 536 430 Q538 442 524 454 Q512 464 500 454 Q486 442 488 430 Z" fill="#2B1E3A"/>
  <path d="M484 474 L540 474 Q540 512 512 514 Q484 512 484 474 Z" fill="#9E1C2B"/>
  <path d="M492 500 Q512 486 532 500 Q526 513 512 514 Q498 513 492 500 Z" fill="#F2585B"/>
  <!-- arm up (right): fist pump with a violet wristband, in front of the cheek -->
  <g transform="translate(18 -16)">
  <path d="M606 548 C670 566 744 580 782 552 C808 530 808 484 798 454 L748 462 C752 494 752 512 738 520 C708 530 660 520 618 506 Z" fill="#3B3870"/>
  <rect x="744" y="462" width="72" height="34" rx="14" fill="#7B5CFF" transform="rotate(-10 780 479)"/>
  <circle cx="778" cy="428" r="44" fill="#3B3870"/>
  <path d="M756 414 Q772 404 788 414 M756 438 Q772 428 788 438" fill="none" stroke="#2C2959" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
